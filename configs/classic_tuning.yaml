# Traditional baseline tuning search spaces.
# The groups and CV settings are separate from configs/default.yaml so that the
# tuning experiment can be changed without touching the shared baseline config.

svm:
  C: [0.1, 0.5, 1.0, 2.0, 5.0]
  gamma: ["scale", 0.001, 0.01]

rf:
  n_estimators: [200, 400]
  max_depth: [null, 10, 20]
  min_samples_leaf: [1, 2, 4]
  max_features: ["sqrt", 0.3]

cv_folds: 3
